services:
  - type: web
    name: zyphers-polar-ems
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app:app --app-dir backend --host 0.0.0.0 --port $PORT"
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GROQ_API_KEY
        sync: false
